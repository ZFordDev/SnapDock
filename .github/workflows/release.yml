name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Determine path separator for --add-data
        id: sep
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then echo "sep=;" >> "$GITHUB_OUTPUT"; else echo "sep=:" >> "$GITHUB_OUTPUT"; fi

      - name: Build standalone binary
        run: >
          pyinstaller --onefile --name snapdock-guppy
          --add-data "snapdock/themes/*${{ steps.sep.outputs.sep }}snapdock/themes"
          --hidden-import pymdownx
          --hidden-import snapdock.fonts
          --hidden-import snapdock.persistence
          --hidden-import snapdock.ui
          --hidden-import snapdock.ui.window
          --hidden-import snapdock.ui.editor
          --hidden-import snapdock.ui.preview
          --hidden-import snapdock.ui.tabs
          --hidden-import snapdock.ui.menubar
          --hidden-import snapdock.ui.footer
          --hidden-import snapdock.ui.filetree
          snapdock/main.py

      - name: Smoke test the binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="dist/snapdock-guppy.exe"; else BIN="dist/snapdock-guppy"; fi
          "$BIN" --version || true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/snapdock-guppy
            dist/snapdock-guppy.exe
          fail_on_unmatched_files: false
