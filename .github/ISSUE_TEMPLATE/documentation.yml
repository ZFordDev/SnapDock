name: Documentation Update
description: Found something confusing, missing, or outdated? Let me know!
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs!

        Found a typo, outdated instructions, or something that just doesn't make sense? Let me know and we'll get it sorted!

  - type: textarea
    id: problem
    attributes:
      label: What needs fixing?
      description: Tell me what's missing, confusing, or incorrect.
      placeholder: |
        The installation instructions are missing a step, or this section could use a better explanation.
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Where did you find it?
      description: A link, file name, screenshot, or anything that helps me find it. No worries if you're not sure!
      placeholder: |
        CONTRIBUTING.md, README.md, or a link to the page.
