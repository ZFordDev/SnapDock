name: Feature Request
description: Suggest an improvement or new feature for SnapDock
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea!  
        Phoenix is experimental and is where V4 features are being built. It may break before it becomes impressive. If you need the safer app, use `main`. Please describe the problem your feature solves.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      placeholder: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      placeholder: Describe the feature or workflow.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered (optional)

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes (optional)
