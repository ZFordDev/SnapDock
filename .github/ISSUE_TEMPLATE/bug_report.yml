name: Bug Report
description: Report a reproducible issue in SnapDock
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve SnapDock!  
        Please provide as much detail as possible.

  - type: input
    id: version
    attributes:
      label: SnapDock Version
      placeholder: e.g., 3.3.1
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation Source
      options:
        - Snap Store
        - GitHub release
        - Microsoft Store
        - Built from source
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Include the Linux desktop environment and Wayland/X11 session when relevant.
      placeholder: e.g., Windows 11 or Ubuntu 24.04, GNOME, Wayland
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List each step clearly.
      placeholder: |
        1. Open SnapDock
        2. Load a Markdown file
        3. Switch preview mode
        4. Crash occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots (optional)
      description: Attach anything helpful.
