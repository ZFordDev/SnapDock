# Check for version updates every Wednesday at 6 am Brisbane time.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
