name: 🐛 Something's broken!
description: Found a bug? Let me know and I'll take a look.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! 🐛

        Don't worry about technical details. Just tell me what's happening and we'll figure it out together.

  - type: textarea
    id: problem
    attributes:
      label: What's going wrong?
      description: Tell me what happened, in your own words.
      placeholder: |
        I was editing a Markdown file and when I switched to preview, the app froze.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Can you make it happen again?
      description: If you know how to trigger it, let me know. If not, that's okay!
      placeholder: |
        It seems to happen whenever I switch to preview with a large file.

  - type: input
    id: version
    attributes:
      label: Which SnapDock version?
      description: If you're not sure, feel free to leave this blank.
      placeholder: e.g. 3.3.3

  - type: input
    id: os
    attributes:
      label: What are you running SnapDock on?
      placeholder: e.g. Windows 11, Ubuntu, Fedora

  - type: textarea
    id: extras
    attributes:
      label: Anything else?
      description: Screenshots, error messages, logs, or anything you think might help. Please remove any private information before sharing.
