name: 💡 Feature Request
description: Got an idea for SnapDock? I'd love to hear it!
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Awesome! 💡

        Big or small, practical or a little crazy, I'd love to hear it!

        Not every idea will make it into SnapDock, but that doesn't mean it isn't worth sharing.

  - type: textarea
    id: idea
    attributes:
      label: What's your idea?
      description: Tell me what you'd like to see added or improved.
      placeholder: |
        It would be cool if SnapDock could...
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: How you'd use it, examples, screenshots, sketches, or anything else you'd like to share. All optional!
      placeholder: |
        I saw something similar in another editor, or here's how I imagine it working...
